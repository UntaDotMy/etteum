<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>etteum · share</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #e8eefc;
    --bg-glow: #d4e0fb;
    --surface: #ffffff;
    --ink: #0f1b33;
    --muted: #5b6b86;
    --faint: #8b98b0;
    --line: #0f1b33;
    --line-soft: #d7e0f2;
    --chip: #f4f7fd;
    --accent: #0e9f6e;
    --accent-soft: #d9f5ea;
    --accent-ink: #066647;
    --warn: #c2410c;
    --warn-soft: #ffedd5;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --bar-track: #e8edf7;
    --bar-fill: #ef4444;
    --bar-fill-ok: #0e9f6e;
    --bar-fill-mid: #f59e0b;
    --shadow: 4px 4px 0 #0f1b33;
    --radius: 18px;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 12% -8%, rgba(255,255,255,.75), transparent 55%),
      radial-gradient(700px 380px at 92% 8%, rgba(14,159,110,.08), transparent 50%),
      linear-gradient(165deg, var(--bg) 0%, var(--bg-glow) 100%);
    -webkit-font-smoothing: antialiased;
    padding: 28px 16px 48px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  /* ── top bar ─────────────────────────────────────── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .mark {
    width: 36px; height: 36px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 2px 2px 0 var(--line);
    display: grid; place-items: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    color: var(--accent-ink);
    flex: 0 0 auto;
  }
  .brand-name {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  .brand-name span {
    color: var(--muted);
    font-weight: 500;
    font-size: 13px;
    margin-left: 6px;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .08em;
    padding: 8px 14px;
    border-radius: 999px;
    border: 2px solid var(--line);
    box-shadow: 2px 2px 0 var(--line);
  }
  .live.standby { background: var(--faint); }
  .live.bad { background: var(--danger); }
  .live .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 0 rgba(255,255,255,.7);
  }
  .live.on .dot { animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); }
    70% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }

  /* ── cards ───────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 2.5px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 22px 20px;
  }
  .card + .card { margin-top: 16px; }

  /* auth prompt */
  .prompt {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .keyin {
    flex: 1;
    min-width: 200px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--chip);
    color: var(--ink);
    font: inherit;
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
  }
  .keyin:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(14,159,110,.18);
  }
  .keyin::placeholder { color: var(--faint); }
  .go {
    border: 2px solid var(--line);
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--line);
  }
  .go:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
  .go:active { transform: none; box-shadow: 1px 1px 0 var(--line); }
  .go:disabled { opacity: .5; cursor: default; transform: none; }
  .err {
    color: var(--danger);
    font-size: 13px;
    font-weight: 600;
    min-height: 18px;
    margin-top: 10px;
  }
  .err:not(:empty)::before { content: "✗ "; }

  .hidden { display: none !important; }
  .sess { animation: rise .32s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* key header */
  .khead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .ktitle {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .kactions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--chip);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    color: var(--ink);
    max-width: 100%;
  }
  .pill span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
  }
  .pill button, .iconbtn {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
  }
  .pill button:hover, .iconbtn:hover { color: var(--accent-ink); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 2px solid var(--line);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    padding: 6px 12px;
  }
  .badge.active { background: var(--accent); color: #fff; }
  .badge.exhausted { background: var(--warn-soft); color: var(--warn); }
  .badge.expired, .badge.inactive { background: var(--danger-soft); color: var(--danger); }

  /* credit hero */
  .credit-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin: 14px 0 6px;
  }
  .credit {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
  }
  .credit-sub {
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
  }

  /* progress */
  .bar-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .bar-meta .pct { color: var(--danger); }
  .bar-meta .pct.ok { color: var(--accent-ink); }
  .bar-meta .pct.mid { color: var(--warn); }
  .bar-meta .side { letter-spacing: .12em; font-size: 11px; }
  .bar {
    margin-top: 6px;
    height: 14px;
    border-radius: 999px;
    background: var(--bar-track);
    border: 2px solid var(--line);
    overflow: hidden;
    position: relative;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--bar-fill);
    border-radius: 999px;
    transition: width .6s ease, background .3s;
  }
  .bar.ok > i { background: var(--bar-fill-ok); }
  .bar.mid > i { background: var(--bar-fill-mid); }
  .bar-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* meta grid */
  .meta {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 2px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-top: 20px;
  }
  .cell {
    padding: 14px 14px 12px;
    background: var(--surface);
    min-width: 0;
    border-right: 2px solid var(--line-soft);
  }
  .cell:last-child { border-right: 0; }
  .cell .k {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--faint);
    margin-bottom: 6px;
  }
  .cell .v {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .cell .v span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cell .v.accent { color: var(--accent-ink); }
  .cell .v.accent span { text-decoration: underline; text-underline-offset: 2px; }

  /* models */
  .mhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .mhead .t {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .mhead .c {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--faint);
  }
  .models {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .m {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: var(--chip);
    border: 2px solid var(--line);
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: transform .08s, box-shadow .08s, background .12s;
  }
  .m:hover {
    background: var(--accent-soft);
    transform: translate(-1px, -1px);
    box-shadow: 2px 2px 0 var(--line);
  }
  .m:active { transform: none; box-shadow: none; }
  .m svg { opacity: .45; flex: 0 0 auto; }
  .none {
    color: var(--muted);
    font-size: 13px;
    padding: 4px 0;
  }

  /* footer */
  .foot {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .foot .tag {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .04em;
  }
  .foot .upd {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .foot .upd i {
    width: 8px; height: 8px; border-radius: 2px;
    background: var(--accent);
    display: inline-block;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 9;
    border: 2px solid var(--line);
    box-shadow: 3px 3px 0 var(--line);
  }
  .toast.show { opacity: 1; }

  @media (max-width: 640px) {
    .credit { font-size: 48px; }
    .meta { grid-template-columns: repeat(2, 1fr); }
    .cell:nth-child(2) { border-right: 0; }
    .cell:nth-child(1), .cell:nth-child(2) {
      border-bottom: 2px solid var(--line-soft);
    }
    .cell:nth-child(3) { border-right: 2px solid var(--line-soft); }
    .card { padding: 18px 16px 16px; }
    .ktitle { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sess, .live.on .dot, .bar > i { animation: none; transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">e·</div>
      <div class="brand-name">etteum<span>pool share</span></div>
    </div>
    <div class="live standby" id="live" aria-live="polite">
      <span class="dot"></span>
      <span id="livetxt">STANDBY</span>
    </div>
  </header>

  <!-- auth card (hidden when auto-connected via share link) -->
  <section class="card" id="authcard">
    <div class="prompt">
      <input id="key" class="keyin" type="password" placeholder="paste friend key  sk-…" autocomplete="off" spellcheck="false" aria-label="API key" />
      <button class="go" id="view" type="button">View status</button>
    </div>
    <div class="err" id="err" role="alert"></div>
  </section>

  <div id="sess" class="sess hidden">
    <section class="card" aria-label="Key status">
      <div class="khead">
        <h1 class="ktitle" id="kname">—</h1>
        <div class="kactions">
          <div class="pill" title="API key">
            <span id="kprev" class="mono">sk-…</span>
            <button type="button" id="copykey" title="Copy key preview" aria-label="Copy key preview">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
          </div>
          <span class="badge active" id="kstatus">ACTIVE</span>
        </div>
      </div>

      <div class="credit-row">
        <div class="credit" id="credit">0</div>
        <div class="credit-sub" id="creditsub">credit left · 0</div>
      </div>

      <div class="bar-meta">
        <span class="pct" id="pctlbl">0%</span>
        <span class="side">LEFT</span>
      </div>
      <div class="bar" id="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <i id="barfill"></i>
      </div>
      <div class="bar-ends">
        <span id="usedlbl">0 used</span>
        <span id="quotalbl">∞ total</span>
      </div>

      <div class="meta">
        <div class="cell">
          <div class="k">TOTAL QUOTA</div>
          <div class="v"><span id="quota">—</span></div>
        </div>
        <div class="cell">
          <div class="k">CREATED</div>
          <div class="v"><span id="created">—</span></div>
        </div>
        <div class="cell">
          <div class="k">LAST USED</div>
          <div class="v"><span id="last">—</span></div>
        </div>
        <div class="cell">
          <div class="k">BASE URL</div>
          <div class="v accent">
            <span id="base">/v1</span>
            <button type="button" class="iconbtn" id="copybase" title="Copy base URL" aria-label="Copy base URL">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>
            </button>
          </div>
        </div>
      </div>
    </section>

    <section class="card" aria-label="Usable models">
      <div class="mhead">
        <div class="t">Models</div>
        <div class="c" id="mcount">0 USABLE</div>
      </div>
      <div class="models" id="models"></div>
    </section>
  </div>

  <footer class="foot">
    <div class="tag">etteum pool · friend key</div>
    <div class="upd"><i aria-hidden="true"></i><span id="upd">awaiting key</span></div>
  </footer>
</div>
<div class="toast" id="toast" role="status">copied</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var keyInput = $("key"), err = $("err"), sess = $("sess"), toast = $("toast");
  var authcard = $("authcard");
  var currentKey = null, timer = null, toastT = null;

  var BACKEND = "__BACKEND_ORIGIN__";
  // Optional absolute base URL for the pool's /v1 route (tunnel setups).
  var BASE_URL = "__SHARE_BASE_URL__";
  // "1" = link-only: only keys embedded in the share link are accepted.
  var LOCK = "__SHARE_LOCK__" === "1";

  // Fragment-only key so it never hits this server's logs.
  function keyFromHash() {
    var h = window.location.hash || "";
    if (h.charAt(0) === "#") h = h.slice(1);
    var params = new URLSearchParams(h);
    return params.get("k") || params.get("key") || params.get("token") || "";
  }

  function fmt(n) {
    if (n == null) return "∞";
    n = Math.round(n);
    if (n >= 1e9) return trim(n / 1e9) + "B";
    if (n >= 1e6) return trim(n / 1e6) + "M";
    if (n >= 1e3) return trim(n / 1e3) + "K";
    return String(n);
  }
  function trim(x) {
    return x.toFixed(x >= 100 ? 0 : x >= 10 ? 1 : 2).replace(/\.0+$|(\.\d*?)0+$/, "$1");
  }
  function full(n) {
    return n == null ? "∞" : Math.round(n).toLocaleString("en-US");
  }
  function rel(iso) {
    if (!iso) return "never";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "—";
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 45) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " mins ago";
    if (s < 86400) return Math.floor(s / 3600) + " hours ago";
    return Math.floor(s / 86400) + " days ago";
  }
  function dte(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }

  function setLive(state) {
    var el = $("live"), txt = $("livetxt");
    el.className = "live" + (state === "on" ? " on" : state === "bad" ? " bad" : " standby");
    txt.textContent = state === "on" ? "LIVE" : state === "bad" ? "OFFLINE" : "STANDBY";
  }

  function baseUrl() {
    if (BASE_URL && BASE_URL !== "__SHARE_BASE_URL__") return BASE_URL;
    return (BACKEND && BACKEND !== "__BACKEND_ORIGIN__" ? BACKEND : "") + "/v1";
  }

  function render(d) {
    sess.classList.remove("hidden");
    // When connected via share link, collapse the paste box for a clean card view.
    if (keyFromHash()) authcard.classList.add("hidden");

    var nm = d.name || "friend key";
    $("kname").textContent = nm;
    $("kprev").textContent = d.keyPreview || "sk-…";

    var st = d.status || "active";
    var stEl = $("kstatus");
    stEl.textContent = st.toUpperCase();
    stEl.className = "badge " + st;
    setLive(st === "active" ? "on" : "bad");

    var quota = d.tokenQuota;
    var used = d.tokensUsed || 0;
    var left = d.tokensLeft;
    var hasQuota = quota != null && quota > 0;
    // % LEFT (remaining), matching the reference card.
    var pctLeft = hasQuota
      ? Math.max(0, Math.min(100, ((left != null ? left : 0) / quota) * 100))
      : 100;
    // Bar fill = used fraction.
    var pctUsed = hasQuota
      ? Math.max(0, Math.min(100, (used / quota) * 100))
      : 0;

    $("credit").textContent = hasQuota ? fmt(left) : "∞";
    $("creditsub").textContent = hasQuota
      ? "credit left · " + full(left)
      : "credit left · unlimited";

    var pctEl = $("pctlbl");
    pctEl.textContent = hasQuota ? Math.round(pctLeft) + "%" : "∞";
    pctEl.className = "pct" + (!hasQuota || pctLeft > 30 ? " ok" : pctLeft > 5 ? " mid" : "");

    var bar = $("bar");
    bar.className = "bar" + (!hasQuota || pctLeft > 30 ? " ok" : pctLeft > 5 ? " mid" : "");
    bar.setAttribute("aria-valuenow", String(Math.round(pctUsed)));
    $("barfill").style.width = (hasQuota ? pctUsed : 0) + "%";

    $("usedlbl").textContent = fmt(used) + " used";
    $("quotalbl").textContent = (hasQuota ? fmt(quota) : "∞") + " total";
    $("quota").textContent = hasQuota ? full(quota) : "∞";
    $("created").textContent = dte(d.createdAt);
    $("last").textContent = rel(d.lastUsedAt);
    $("base").textContent = baseUrl();

    var models = Array.isArray(d.models) ? d.models : [];
    $("mcount").textContent = models.length + " USABLE";
    var box = $("models");
    box.innerHTML = "";
    if (!models.length) {
      box.innerHTML = '<div class="none">No models available for this key</div>';
    }
    models.forEach(function (id) {
      var el = document.createElement("button");
      el.type = "button";
      el.className = "m";
      el.title = "Copy model id";
      el.innerHTML =
        esc(id) +
        ' <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';
      el.onclick = function () { copy(id); };
      box.appendChild(el);
    });

    $("upd").textContent = "updated just now";
  }

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast, function () {});
    }
  }
  function showToast() {
    toast.classList.add("show");
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { toast.classList.remove("show"); }, 1400);
  }

  function fail(msg) {
    sess.classList.add("hidden");
    setLive("bad");
    err.textContent = msg || "";
    authcard.classList.remove("hidden");
    $("upd").textContent = "awaiting key";
  }

  function load() {
    if (!currentKey) return;
    fetch(BACKEND + "/v1/share", { headers: { "Authorization": "Bearer " + currentKey } })
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (res) {
        if (!res.ok) {
          fail((res.j && res.j.error && res.j.error.message) || "invalid key");
          return;
        }
        err.textContent = "";
        render(res.j);
      })
      .catch(function () { fail("could not reach the pool backend"); });
  }

  function start() {
    var k = keyInput.value.trim();
    if (!k) { fail("paste a key first"); return; }
    startWithKey(k);
  }

  function startWithKey(k) {
    currentKey = k;
    err.textContent = "";
    if (timer) clearInterval(timer);
    load();
    timer = setInterval(load, 10000);
  }

  var urlKey = keyFromHash();
  if (urlKey) {
    keyInput.value = urlKey;
    startWithKey(urlKey);
  } else if (LOCK) {
    authcard.classList.add("hidden");
    setLive("bad");
    err.textContent = "this page opens from a shared link. Ask for your link.";
    // Keep err visible: put a minimal surface back
    authcard.classList.remove("hidden");
    var prompt = authcard.querySelector(".prompt");
    if (prompt) prompt.classList.add("hidden");
  }

  $("view").addEventListener("click", start);
  keyInput.addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });
  $("copybase").addEventListener("click", function () { copy(baseUrl()); });
  $("copykey").addEventListener("click", function () {
    // Preview only — full key is never re-fetched after creation.
    copy($("kprev").textContent || "");
  });
})();
</script>
</body>
</html>
