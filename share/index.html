<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Keys</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  /*
   * Tokens aligned with dashboard/src/index.css (keel/pool theme).
   * Dark default; media prefers-color-scheme light switches to .light values.
   */
  :root {
    --background: #1e1e1e;
    --foreground: #cccccc;
    --card: #252526;
    --card-foreground: #cccccc;
    --primary: #00ff88;
    --primary-foreground: #1e1e1e;
    --muted: #3c3c3c;
    --muted-foreground: #858585;
    --border: #3c3c3c;
    --success: #00ff88;
    --warning: #ffb224;
    --error: #ff5c5c;
    --radius: 0.625rem;
    --shadow-card: 0 2px 4px rgba(0, 0, 0, 0.3), 0 4px 8px rgba(0, 0, 0, 0.2);
    --sans: "IBM Plex Sans", system-ui, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, monospace;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --background: #f3f7f4;
      --foreground: #0a1610;
      --card: #ffffff;
      --card-foreground: #0a1610;
      --primary: #00a857;
      --primary-foreground: #ffffff;
      --muted: #eef3f0;
      --muted-foreground: #5e6f66;
      --border: #dbe4df;
      --success: #15a34a;
      --warning: #c2710c;
      --error: #dc2626;
      --shadow-card: 0 1px 2px rgba(16, 24, 20, 0.06), 0 1px 3px rgba(16, 24, 20, 0.08);
    }
  }

  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--foreground);
    background: var(--background);
    -webkit-font-smoothing: antialiased;
    padding: 28px 16px 48px;
  }
  .wrap { max-width: 640px; margin: 0 auto; }

  header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 24px;
  }
  .title {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--foreground);
  }
  .live {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--muted-foreground);
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .live i {
    width: 6px; height: 6px; border-radius: 50%;
    background: var(--muted-foreground);
  }
  .live.on i { background: var(--success); }
  .live.off i { background: var(--error); }

  .empty {
    background: var(--card);
    color: var(--card-foreground);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 48px 24px;
    text-align: center;
  }
  .empty h1 {
    margin: 0 0 8px;
    font-size: 16px;
    font-weight: 600;
  }
  .empty p {
    margin: 0;
    font-size: 13px;
    color: var(--muted-foreground);
    line-height: 1.5;
  }

  #board { display: flex; flex-direction: column; gap: 12px; }
  .hidden { display: none !important; }

  .card {
    background: var(--card);
    color: var(--card-foreground);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 18px;
  }

  .row-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 14px;
  }
  .name {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; justify-content: flex-end; }
  .tag {
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 500;
    padding: 2px 8px;
    border-radius: calc(var(--radius) - 4px);
    border: 1px solid var(--border);
    color: var(--muted-foreground);
    text-transform: lowercase;
  }
  .tag.ok {
    color: var(--success);
    border-color: color-mix(in srgb, var(--success) 35%, var(--border));
    background: color-mix(in srgb, var(--success) 12%, transparent);
  }
  .tag.warn {
    color: var(--warning);
    border-color: color-mix(in srgb, var(--warning) 35%, var(--border));
    background: color-mix(in srgb, var(--warning) 12%, transparent);
  }
  .tag.bad {
    color: var(--error);
    border-color: color-mix(in srgb, var(--error) 35%, var(--border));
    background: color-mix(in srgb, var(--error) 12%, transparent);
  }
  .tag.conn {
    color: var(--primary);
    border-color: color-mix(in srgb, var(--primary) 35%, var(--border));
    background: color-mix(in srgb, var(--primary) 12%, transparent);
  }
  .tag.conn::before {
    content: "";
    display: inline-block;
    width: 5px; height: 5px;
    border-radius: 50%;
    background: currentColor;
    margin-right: 5px;
    vertical-align: 1px;
  }

  .keybox {
    display: flex;
    align-items: stretch;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 2px);
    overflow: hidden;
    background: color-mix(in srgb, var(--muted) 45%, var(--card));
    margin-bottom: 16px;
  }
  .keybox code {
    flex: 1;
    min-width: 0;
    padding: 10px 12px;
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 500;
    word-break: break-all;
    line-height: 1.45;
    color: var(--foreground);
    /* Secret stays visually blurred; copy still uses the full string. */
    filter: blur(5px);
    user-select: none;
    transition: filter 0.15s ease;
  }
  .keybox:focus-within code,
  .keybox:hover code {
    filter: blur(5px); /* stay blurred even on hover — reveal only via copy */
  }
  .keybox button {
    flex: 0 0 auto;
    border: 0;
    border-left: 1px solid var(--border);
    background: var(--card);
    color: var(--foreground);
    font-family: var(--sans);
    font-size: 12px;
    font-weight: 600;
    padding: 0 14px;
    cursor: pointer;
  }
  .keybox button:hover {
    background: color-mix(in srgb, var(--primary) 12%, var(--card));
    color: var(--primary);
  }
  .keybox button:focus-visible {
    outline: 2px solid var(--primary);
    outline-offset: -2px;
  }
  .keybox button.done { color: var(--success); }

  .metric {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 8px;
  }
  .left {
    font-size: 26px;
    font-weight: 600;
    letter-spacing: -0.03em;
    font-variant-numeric: tabular-nums;
    color: var(--foreground);
  }
  .left.ok { color: var(--success); }
  .left.mid { color: var(--warning); }
  .left.low { color: var(--error); }
  .left-label {
    font-size: 12px;
    color: var(--muted-foreground);
    margin-top: 2px;
  }
  .delta {
    font-family: var(--mono);
    font-size: 11px;
    font-weight: 500;
    opacity: 0;
    transition: opacity 0.2s;
  }
  .delta.show { opacity: 1; }
  .delta.down { color: var(--error); }
  .delta.up { color: var(--success); }

  .track {
    height: 6px;
    background: var(--muted);
    border-radius: 3px;
    overflow: hidden;
  }
  .track > i {
    display: block;
    height: 100%;
    width: 0;
    border-radius: 3px;
    transition: width 0.55s ease, background-color 0.3s ease;
  }
  .track.ok > i { background: var(--success); }
  .track.mid > i { background: var(--warning); }
  .track.low > i { background: var(--error); }

  .bar-foot {
    display: flex;
    justify-content: space-between;
    margin-top: 6px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted-foreground);
  }

  .speed {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
    margin-top: 14px;
  }
  .speed .cell {
    background: color-mix(in srgb, var(--muted) 55%, transparent);
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 4px);
    padding: 10px 12px;
  }
  .speed .cell .v {
    font-family: var(--mono);
    font-size: 15px;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--foreground);
  }
  .speed .cell .l {
    margin-top: 2px;
    font-size: 11px;
    color: var(--muted-foreground);
  }

  .meta {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 16px;
    margin-top: 16px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  @media (min-width: 560px) {
    .meta { grid-template-columns: repeat(4, 1fr); }
  }
  .meta dt {
    margin: 0;
    font-size: 11px;
    color: var(--muted-foreground);
    font-weight: 500;
  }
  .meta dd {
    margin: 3px 0 0;
    font-size: 12px;
    font-weight: 500;
    font-family: var(--mono);
    word-break: break-all;
  }
  .meta dd button {
    border: 0;
    background: none;
    padding: 0;
    margin-left: 6px;
    font: inherit;
    color: var(--muted-foreground);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
  }
  .meta dd button:hover { color: var(--primary); }

  .models {
    margin-top: 14px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }
  .models h2 {
    margin: 0 0 8px;
    font-size: 11px;
    font-weight: 500;
    color: var(--muted-foreground);
    letter-spacing: 0.02em;
  }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip {
    font-family: var(--mono);
    font-size: 11px;
    padding: 4px 8px;
    border: 1px solid var(--border);
    border-radius: calc(var(--radius) - 4px);
    background: transparent;
    color: var(--foreground);
    cursor: pointer;
  }
  .chip:hover {
    border-color: color-mix(in srgb, var(--primary) 40%, var(--border));
    color: var(--primary);
  }
  .none { font-size: 13px; color: var(--muted-foreground); }

  footer {
    margin-top: 20px;
    font-size: 11px;
    font-family: var(--mono);
    color: var(--muted-foreground);
    text-align: right;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 20px;
    transform: translateX(-50%);
    background: var(--foreground);
    color: var(--background);
    font-size: 12px;
    font-weight: 500;
    padding: 8px 14px;
    border-radius: calc(var(--radius) - 2px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s;
    z-index: 20;
  }
  .toast.show { opacity: 1; }

  @media (prefers-reduced-motion: reduce) {
    .track > i, .keybox code, .delta { transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 class="title">Keys</h1>
    <div class="live" id="live"><i></i><span id="livetxt">idle</span></div>
  </header>

  <section class="empty" id="empty">
    <h1>No keys yet</h1>
    <p>Come back later.</p>
  </section>

  <div id="board" class="hidden"></div>

  <footer><span id="upd">—</span></footer>
</div>
<div class="toast" id="toast">Copied</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var board = $("board"), empty = $("empty"), toast = $("toast");
  var prev = {};
  var toastT = null;
  var POLL_MS = 3000;
  var BACKEND = "__BACKEND_ORIGIN__";
  var BASE_URL = "__SHARE_BASE_URL__";

  function fmt(n) {
    if (n == null) return "∞";
    n = Math.round(n);
    if (n >= 1e9) return trim(n / 1e9) + "B";
    if (n >= 1e6) return trim(n / 1e6) + "M";
    if (n >= 1e3) return trim(n / 1e3) + "K";
    return String(n);
  }
  function trim(x) {
    return x.toFixed(x >= 100 ? 0 : x >= 10 ? 1 : 2).replace(/\.0+$|(\.\d*?)0+$/, "$1");
  }
  function full(n) {
    return n == null ? "∞" : Math.round(n).toLocaleString("en-US");
  }
  function rel(iso) {
    if (!iso) return "never";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "—";
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 45) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  function dte(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c];
    });
  }
  function fmtMs(n) {
    if (n == null || !isFinite(n)) return "—";
    n = Number(n);
    if (n < 1000) return Math.round(n) + "ms";
    return (n / 1000).toFixed(n >= 10000 ? 1 : 2).replace(/\.0+$|(\.\d*?)0+$/, "$1") + "s";
  }
  function fmtTps(n) {
    if (n == null || !isFinite(n) || n <= 0) return "—";
    n = Number(n);
    if (n >= 100) return Math.round(n) + " tok/s";
    return (Math.round(n * 10) / 10) + " tok/s";
  }
  function tone(pctLeft, hasQuota) {
    if (!hasQuota) return "ok";
    if (pctLeft <= 12) return "low";
    if (pctLeft <= 35) return "mid";
    return "ok";
  }
  function baseUrl() {
    // Prefer injected SHARE_BASE_URL; else same-origin /v1 (public share proxy).
    if (BASE_URL && BASE_URL !== "__SHARE_BASE_URL__" && BASE_URL.trim()) return BASE_URL.replace(/\/$/, "");
    if (typeof window !== "undefined" && window.location && window.location.origin) {
      return window.location.origin.replace(/\/$/, "") + "/v1";
    }
    return (BACKEND && BACKEND !== "__BACKEND_ORIGIN__" ? BACKEND : "") + "/v1";
  }
  function setLive(mode) {
    var el = $("live");
    el.className = "live" + (mode === "on" ? " on" : mode === "off" ? " off" : "");
    $("livetxt").textContent = mode === "on" ? "live" : mode === "off" ? "offline" : "idle";
  }
  function showEmpty() {
    board.classList.add("hidden");
    board.innerHTML = "";
    empty.classList.remove("hidden");
    setLive("idle");
    $("upd").textContent = "come back later";
  }
  /** Works on http://public-ip (Clipboard API is blocked outside secure contexts). */
  function copyText(text) {
    if (!text) return Promise.resolve(false);
    if (window.isSecureContext && navigator.clipboard && navigator.clipboard.writeText) {
      return navigator.clipboard.writeText(text).then(
        function () { return true; },
        function () { return copyTextLegacy(text); }
      );
    }
    return Promise.resolve(copyTextLegacy(text));
  }
  function copyTextLegacy(text) {
    try {
      var ta = document.createElement("textarea");
      ta.value = text;
      ta.setAttribute("readonly", "");
      ta.setAttribute("aria-hidden", "true");
      ta.style.position = "fixed";
      ta.style.left = "-9999px";
      ta.style.top = "0";
      ta.style.opacity = "0";
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, text.length);
      var ok = document.execCommand("copy");
      document.body.removeChild(ta);
      return ok;
    } catch (e) {
      return false;
    }
  }
  function copy(text, btn) {
    if (!text) return;
    copyText(text).then(function (ok) {
      if (!ok) {
        toast.textContent = "Copy failed — select text manually";
        toast.classList.add("show");
        if (toastT) clearTimeout(toastT);
        toastT = setTimeout(function () { toast.classList.remove("show"); }, 2000);
        return;
      }
      toast.textContent = "Copied";
      toast.classList.add("show");
      if (toastT) clearTimeout(toastT);
      toastT = setTimeout(function () { toast.classList.remove("show"); }, 1200);
      if (btn) {
        var old = btn.textContent;
        btn.textContent = "Copied";
        btn.classList.add("done");
        setTimeout(function () {
          btn.textContent = old;
          btn.classList.remove("done");
        }, 1200);
      }
    });
  }

  function card(d, bu) {
    var id = String(d.id != null ? d.id : "");
    var fullKey = d.key || "";
    var st = d.status || "active";
    var quota = d.tokenQuota;
    var used = d.tokensUsed || 0;
    var left = d.tokensLeft;
    var hasQuota = quota != null && quota > 0;
    var pctLeft = hasQuota
      ? Math.max(0, Math.min(100, ((left != null ? left : 0) / quota) * 100))
      : 100;
    var t = tone(pctLeft, hasQuota);
    var stClass = st === "active" ? "ok" : st === "exhausted" ? "warn" : "bad";
    var models = Array.isArray(d.models) ? d.models : [];
    var chips = models.length
      ? models
          .map(function (m) {
            return (
              '<button type="button" class="chip" data-copy="' +
              esc(m) +
              '">' +
              esc(m) +
              "</button>"
            );
          })
          .join("")
      : '<span class="none">No models</span>';
    var ttft = fmtMs(d.ttftMs);
    var tps = fmtTps(d.tokensPerSecond);

    return (
      '<article class="card" data-id="' +
      esc(id) +
      '">' +
      '<div class="row-top">' +
      '<h2 class="name">' +
      esc(d.name || "Key") +
      "</h2>" +
      '<div class="tags">' +
      '<span class="tag ' +
      stClass +
      '">' +
      esc(st) +
      "</span></div></div>" +
      '<div class="keybox">' +
      "<code aria-hidden=\"true\">" +
      esc(fullKey || d.keyPreview || "—") +
      "</code>" +
      '<button type="button" data-copy="' +
      esc(fullKey) +
      '" title="Copy full API key">Copy key</button></div>' +
      '<div class="metric">' +
      "<div><div class=\"left " +
      t +
      '">' +
      esc(hasQuota ? fmt(left) : "∞") +
      '</div><div class="left-label">credit left' +
      (hasQuota ? " · " + Math.round(pctLeft) + "%" : "") +
      '</div></div><span class="delta" data-delta="' +
      esc(id) +
      '"></span></div>' +
      '<div class="track ' +
      t +
      '" role="progressbar" aria-valuenow="' +
      Math.round(pctLeft) +
      '" aria-valuemin="0" aria-valuemax="100"><i style="width:' +
      pctLeft +
      '%"></i></div>' +
      '<div class="bar-foot"><span>' +
      esc(fmt(used)) +
      " used</span><span>" +
      esc(hasQuota ? fmt(quota) : "∞") +
      " total</span></div>" +
      '<div class="speed">' +
      '<div class="cell"><div class="v">' +
      esc(ttft) +
      '</div><div class="l">TTFT (avg 15m)</div></div>' +
      '<div class="cell"><div class="v">' +
      esc(tps) +
      '</div><div class="l">tok/s (avg 15m)</div></div>' +
      "</div>" +
      '<dl class="meta">' +
      "<div><dt>Created</dt><dd>" +
      esc(dte(d.createdAt)) +
      "</dd></div>" +
      "<div><dt>Last used</dt><dd>" +
      esc(rel(d.lastUsedAt)) +
      "</dd></div>" +
      "<div><dt>Quota</dt><dd>" +
      esc(hasQuota ? full(quota) : "∞") +
      "</dd></div>" +
      "<div><dt>Base URL</dt><dd>" +
      esc(bu) +
      ' <button type="button" data-copy="' +
      esc(bu) +
      '">copy</button></dd></div>' +
      "</dl>" +
      '<div class="models"><h2>Models · ' +
      models.length +
      '</h2><div class="chips">' +
      chips +
      "</div></div></article>"
    );
  }

  function flashDeltas(keys) {
    keys.forEach(function (d) {
      var id = String(d.id != null ? d.id : "");
      var left = d.tokensLeft;
      var used = d.tokensUsed || 0;
      var p = prev[id];
      prev[id] = { left: left, used: used };
      if (!p) return;
      var el = board.querySelector('[data-delta="' + id + '"]');
      if (!el) return;
      var delta = null;
      if (p.left != null && left != null && left !== p.left) delta = left - p.left;
      else if (used !== p.used) delta = p.used - used;
      if (delta == null || delta === 0) return;
      el.className = "delta show " + (delta < 0 ? "down" : "up");
      el.textContent = (delta > 0 ? "+" : "") + fmt(delta);
      setTimeout(function () { el.classList.remove("show"); }, 2000);
    });
  }

  function render(payload) {
    var keys = Array.isArray(payload.keys) ? payload.keys : [];
    if (!keys.length) {
      showEmpty();
      return;
    }
    empty.classList.add("hidden");
    board.classList.remove("hidden");
    var bu = baseUrl();
    board.innerHTML = keys.map(function (k) { return card(k, bu); }).join("");
    flashDeltas(keys);
    var clients = Number(payload.activeClients) || 0;
    var any = clients > 0 || keys.some(function (k) { return k.status === "active"; });
    setLive(any ? "on" : "off");
    // Speed (TTFT / tok/s) lives only on each key card — do not also stamp
    // board-level averages into this status line (that was a visible duplicate).
    var parts = [
      keys.length + " key" + (keys.length === 1 ? "" : "s"),
      clients + " in flight",
      "just now",
    ];
    $("upd").textContent = parts.join(" · ");
  }

  function load() {
    fetch("/v1/share/board", { cache: "no-store" })
      .then(function (r) {
        return r.json().then(function (j) {
          return { ok: r.ok, j: j };
        });
      })
      .then(function (res) {
        if (!res.ok) {
          showEmpty();
          return;
        }
        render(res.j || {});
      })
      .catch(function () {
        showEmpty();
      });
  }

  document.addEventListener("click", function (e) {
    var t = e.target;
    if (!t || !t.closest) return;
    var btn = t.closest("[data-copy]");
    if (!btn) return;
    copy(btn.getAttribute("data-copy") || "", btn.tagName === "BUTTON" ? btn : null);
  });

  load();
  setInterval(load, POLL_MS);
})();
</script>
</body>
</html>
