<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>etteum · share</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #e8eefc;
    --bg-glow: #d4e0fb;
    --surface: #ffffff;
    --ink: #0f1b33;
    --muted: #5b6b86;
    --faint: #8b98b0;
    --line: #0f1b33;
    --line-soft: #d7e0f2;
    --chip: #f4f7fd;
    --accent: #0e9f6e;
    --accent-soft: #d9f5ea;
    --accent-ink: #066647;
    --warn: #c2410c;
    --warn-soft: #ffedd5;
    --danger: #dc2626;
    --danger-soft: #fee2e2;
    --bar-track: #e8edf7;
    --bar-fill: #ef4444;
    --bar-fill-ok: #0e9f6e;
    --bar-fill-mid: #f59e0b;
    --shadow: 4px 4px 0 #0f1b33;
    --radius: 18px;
    --sans: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: var(--sans);
    color: var(--ink);
    background:
      radial-gradient(900px 420px at 12% -8%, rgba(255,255,255,.75), transparent 55%),
      radial-gradient(700px 380px at 92% 8%, rgba(14,159,110,.08), transparent 50%),
      linear-gradient(165deg, var(--bg) 0%, var(--bg-glow) 100%);
    -webkit-font-smoothing: antialiased;
    padding: 28px 16px 48px;
  }
  .wrap {
    max-width: 720px;
    margin: 0 auto;
  }

  /* ── top bar ─────────────────────────────────────── */
  .top {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 18px;
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    min-width: 0;
  }
  .mark {
    width: 36px; height: 36px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--surface);
    box-shadow: 2px 2px 0 var(--line);
    display: grid; place-items: center;
    font-family: var(--mono);
    font-weight: 700;
    font-size: 13px;
    color: var(--accent-ink);
    flex: 0 0 auto;
  }
  .brand-name {
    font-weight: 800;
    font-size: 18px;
    letter-spacing: -0.02em;
  }
  .brand-name span {
    color: var(--muted);
    font-weight: 500;
    font-size: 13px;
    margin-left: 6px;
  }
  .live {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    background: var(--accent);
    color: #fff;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: .08em;
    padding: 8px 14px;
    border-radius: 999px;
    border: 2px solid var(--line);
    box-shadow: 2px 2px 0 var(--line);
  }
  .live.standby { background: var(--faint); }
  .live.bad { background: var(--danger); }
  .live .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 0 rgba(255,255,255,.7);
  }
  .live.on .dot { animation: pulse 1.6s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(255,255,255,.55); }
    70% { box-shadow: 0 0 0 8px rgba(255,255,255,0); }
    100% { box-shadow: 0 0 0 0 rgba(255,255,255,0); }
  }

  /* ── cards ───────────────────────────────────────── */
  .card {
    background: var(--surface);
    border: 2.5px solid var(--line);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 22px 22px 20px;
  }
  .card + .card { margin-top: 16px; }

  /* auth prompt */
  .prompt {
    display: flex;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
  }
  .keyin {
    flex: 1;
    min-width: 200px;
    border: 2px solid var(--line);
    border-radius: 12px;
    background: var(--chip);
    color: var(--ink);
    font: inherit;
    font-family: var(--mono);
    font-size: 14px;
    padding: 12px 14px;
    outline: none;
  }
  .keyin:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(14,159,110,.18);
  }
  .keyin::placeholder { color: var(--faint); }
  .go {
    border: 2px solid var(--line);
    background: var(--ink);
    color: #fff;
    font: inherit;
    font-weight: 700;
    font-size: 13px;
    padding: 12px 18px;
    border-radius: 12px;
    cursor: pointer;
    box-shadow: 2px 2px 0 var(--line);
  }
  .go:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
  .go:active { transform: none; box-shadow: 1px 1px 0 var(--line); }
  .go:disabled { opacity: .5; cursor: default; transform: none; }
  .empty {
    text-align: center;
    padding: 42px 20px 36px;
  }
  .empty .icon {
    width: 56px; height: 56px;
    margin: 0 auto 16px;
    border: 2.5px solid var(--line);
    border-radius: 16px;
    background: var(--chip);
    box-shadow: 2px 2px 0 var(--line);
    display: grid; place-items: center;
    font-size: 22px;
  }
  .empty h2 {
    margin: 0 0 8px;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.03em;
  }
  .empty p {
    margin: 0;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.5;
    max-width: 320px;
    margin-inline: auto;
  }

  .hidden { display: none !important; }
  .sess { animation: rise .32s ease; }
  @keyframes rise {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: none; }
  }

  /* key header */
  .khead {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .ktitle {
    font-size: 26px;
    font-weight: 800;
    letter-spacing: -0.03em;
    line-height: 1.15;
  }
  .kactions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 2px solid var(--line);
    border-radius: 999px;
    background: var(--chip);
    font-family: var(--mono);
    font-size: 12px;
    font-weight: 600;
    padding: 6px 12px;
    color: var(--ink);
    max-width: 100%;
  }
  .pill span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    max-width: 180px;
  }
  .pill button, .iconbtn {
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    color: var(--muted);
    display: inline-flex;
    align-items: center;
  }
  .pill button:hover, .iconbtn:hover { color: var(--accent-ink); }
  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    border: 2px solid var(--line);
    border-radius: 999px;
    font-size: 11px;
    font-weight: 800;
    letter-spacing: .08em;
    padding: 6px 12px;
  }
  .badge.active { background: var(--accent); color: #fff; }
  .badge.exhausted { background: var(--warn-soft); color: var(--warn); }
  .badge.expired, .badge.inactive { background: var(--danger-soft); color: var(--danger); }

  /* credit hero */
  .credit-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    flex-wrap: wrap;
    margin: 14px 0 6px;
  }
  .credit {
    font-size: 64px;
    font-weight: 800;
    letter-spacing: -0.04em;
    line-height: 1;
    color: var(--ink);
  }
  .credit-sub {
    color: var(--muted);
    font-size: 14px;
    font-weight: 500;
  }

  /* progress */
  .bar-meta {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 10px;
    font-size: 12px;
    font-weight: 700;
    color: var(--muted);
  }
  .bar-meta .pct { color: var(--danger); }
  .bar-meta .pct.ok { color: var(--accent-ink); }
  .bar-meta .pct.mid { color: var(--warn); }
  .bar-meta .side { letter-spacing: .12em; font-size: 11px; }
  .bar {
    margin-top: 6px;
    height: 14px;
    border-radius: 999px;
    background: var(--bar-track);
    border: 2px solid var(--line);
    overflow: hidden;
    position: relative;
  }
  .bar > i {
    display: block;
    height: 100%;
    width: 0;
    background: var(--bar-fill);
    border-radius: 999px;
    transition: width .6s ease, background .3s;
  }
  .bar.ok > i { background: var(--bar-fill-ok); }
  .bar.mid > i { background: var(--bar-fill-mid); }
  .bar-ends {
    display: flex;
    justify-content: space-between;
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
    font-family: var(--mono);
  }

  /* meta grid */
  .meta {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 0;
    border: 2px solid var(--line);
    border-radius: 14px;
    overflow: hidden;
    margin-top: 20px;
  }
  .cell {
    padding: 14px 14px 12px;
    background: var(--surface);
    min-width: 0;
    border-right: 2px solid var(--line-soft);
  }
  .cell:last-child { border-right: 0; }
  .cell .k {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: .14em;
    color: var(--faint);
    margin-bottom: 6px;
  }
  .cell .v {
    font-size: 14px;
    font-weight: 700;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 6px;
    min-width: 0;
  }
  .cell .v span {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .cell .v.accent { color: var(--accent-ink); }
  .cell .v.accent span { text-decoration: underline; text-underline-offset: 2px; }

  /* models */
  .mhead {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 14px;
  }
  .mhead .t {
    font-size: 18px;
    font-weight: 800;
    letter-spacing: -0.02em;
  }
  .mhead .c {
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .12em;
    color: var(--faint);
  }
  .models {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
  }
  .m {
    font-family: var(--mono);
    font-size: 12.5px;
    font-weight: 600;
    color: var(--ink);
    background: var(--chip);
    border: 2px solid var(--line);
    padding: 8px 12px;
    border-radius: 999px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: transform .08s, box-shadow .08s, background .12s;
  }
  .m:hover {
    background: var(--accent-soft);
    transform: translate(-1px, -1px);
    box-shadow: 2px 2px 0 var(--line);
  }
  .m:active { transform: none; box-shadow: none; }
  .m svg { opacity: .45; flex: 0 0 auto; }
  .none {
    color: var(--muted);
    font-size: 13px;
    padding: 4px 0;
  }
  #board { display: flex; flex-direction: column; gap: 16px; }
  #board .card + .card { margin-top: 0; }
  .key-block { display: flex; flex-direction: column; gap: 16px; }

  /* footer */
  .foot {
    margin-top: 18px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    color: var(--muted);
    font-size: 12px;
    font-weight: 500;
  }
  .foot .tag {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: .04em;
  }
  .foot .upd {
    display: inline-flex;
    align-items: center;
    gap: 7px;
  }
  .foot .upd i {
    width: 8px; height: 8px; border-radius: 2px;
    background: var(--accent);
    display: inline-block;
  }

  .toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%);
    background: var(--ink);
    color: #fff;
    padding: 10px 16px;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    opacity: 0;
    pointer-events: none;
    transition: opacity .2s;
    z-index: 9;
    border: 2px solid var(--line);
    box-shadow: 3px 3px 0 var(--line);
  }
  .toast.show { opacity: 1; }

  @media (max-width: 640px) {
    .credit { font-size: 48px; }
    .meta { grid-template-columns: repeat(2, 1fr); }
    .cell:nth-child(2) { border-right: 0; }
    .cell:nth-child(1), .cell:nth-child(2) {
      border-bottom: 2px solid var(--line-soft);
    }
    .cell:nth-child(3) { border-right: 2px solid var(--line-soft); }
    .card { padding: 18px 16px 16px; }
    .ktitle { font-size: 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .sess, .live.on .dot, .bar > i { animation: none; transition: none; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand">
      <div class="mark" aria-hidden="true">e·</div>
      <div class="brand-name">etteum<span>pool share</span></div>
    </div>
    <div class="live standby" id="live" aria-live="polite">
      <span class="dot"></span>
      <span id="livetxt">STANDBY</span>
    </div>
  </header>

  <!-- shown when admin has not created any managed keys yet -->
  <section class="card empty" id="empty" aria-live="polite">
    <div class="icon" aria-hidden="true">🔑</div>
    <h2 id="emptytitle">No keys yet</h2>
    <p id="emptymsg">Nothing has been shared with you right now. Come back later.</p>
  </section>

  <!-- one status block per managed key from GET /v1/share/board -->
  <div id="board" class="sess hidden" aria-live="polite"></div>

  <footer class="foot">
    <div class="tag">etteum pool · friend keys</div>
    <div class="upd"><i aria-hidden="true"></i><span id="upd">waiting</span></div>
  </footer>
</div>
<div class="toast" id="toast" role="status">copied</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var board = $("board"), empty = $("empty"), toast = $("toast");
  var timer = null, toastT = null;

  // BASE URL display only — status is same-origin via share proxy.
  var BACKEND = "__BACKEND_ORIGIN__";
  var BASE_URL = "__SHARE_BASE_URL__";
  var COPY_SVG =
    '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>';

  function fmt(n) {
    if (n == null) return "∞";
    n = Math.round(n);
    if (n >= 1e9) return trim(n / 1e9) + "B";
    if (n >= 1e6) return trim(n / 1e6) + "M";
    if (n >= 1e3) return trim(n / 1e3) + "K";
    return String(n);
  }
  function trim(x) {
    return x.toFixed(x >= 100 ? 0 : x >= 10 ? 1 : 2).replace(/\.0+$|(\.\d*?)0+$/, "$1");
  }
  function full(n) {
    return n == null ? "∞" : Math.round(n).toLocaleString("en-US");
  }
  function rel(iso) {
    if (!iso) return "never";
    var t = new Date(iso).getTime();
    if (isNaN(t)) return "—";
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 45) return "just now";
    if (s < 3600) return Math.floor(s / 60) + " mins ago";
    if (s < 86400) return Math.floor(s / 3600) + " hours ago";
    return Math.floor(s / 86400) + " days ago";
  }
  function dte(iso) {
    if (!iso) return "—";
    var d = new Date(iso);
    if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function setLive(state) {
    var el = $("live"), txt = $("livetxt");
    el.className = "live" + (state === "on" ? " on" : state === "bad" ? " bad" : " standby");
    txt.textContent = state === "on" ? "LIVE" : state === "bad" ? "OFFLINE" : "STANDBY";
  }

  function baseUrl() {
    if (BASE_URL && BASE_URL !== "__SHARE_BASE_URL__") return BASE_URL;
    return (BACKEND && BACKEND !== "__BACKEND_ORIGIN__" ? BACKEND : "") + "/v1";
  }

  function showEmpty(title, msg) {
    board.classList.add("hidden");
    board.innerHTML = "";
    empty.classList.remove("hidden");
    $("emptytitle").textContent = title || "No keys yet";
    $("emptymsg").textContent = msg || "Nothing has been shared with you right now. Come back later.";
    setLive("standby");
    $("upd").textContent = "come back later";
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast, function () {});
    }
  }
  function showToast() {
    toast.classList.add("show");
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { toast.classList.remove("show"); }, 1400);
  }

  function cardHtml(d, bu) {
    var nm = d.name || "friend key";
    var st = d.status || "active";
    var quota = d.tokenQuota;
    var used = d.tokensUsed || 0;
    var left = d.tokensLeft;
    var hasQuota = quota != null && quota > 0;
    var pctLeft = hasQuota
      ? Math.max(0, Math.min(100, ((left != null ? left : 0) / quota) * 100))
      : 100;
    var pctUsed = hasQuota ? Math.max(0, Math.min(100, (used / quota) * 100)) : 0;
    var barTone = !hasQuota || pctLeft > 30 ? " ok" : pctLeft > 5 ? " mid" : "";
    var credit = hasQuota ? fmt(left) : "∞";
    var creditSub = hasQuota ? "credit left · " + full(left) : "credit left · unlimited";
    var models = Array.isArray(d.models) ? d.models : [];
    var modelsHtml = models.length
      ? models
          .map(function (id) {
            return (
              '<button type="button" class="m" data-copy="' +
              esc(id) +
              '" title="Copy model id">' +
              esc(id) +
              " " +
              COPY_SVG +
              "</button>"
            );
          })
          .join("")
      : '<div class="none">No models available for this key</div>';

    return (
      '<div class="key-block">' +
      '<section class="card" aria-label="Key status">' +
      '<div class="khead">' +
      '<h1 class="ktitle">' +
      esc(nm) +
      "</h1>" +
      '<div class="kactions">' +
      '<div class="pill" title="API key preview">' +
      '<span class="mono">' +
      esc(d.keyPreview || "sk-…") +
      "</span>" +
      '<button type="button" class="iconbtn" data-copy="' +
      esc(d.keyPreview || "") +
      '" title="Copy key preview" aria-label="Copy key preview">' +
      COPY_SVG +
      "</button>" +
      "</div>" +
      '<span class="badge ' +
      esc(st) +
      '">' +
      esc(st.toUpperCase()) +
      "</span>" +
      "</div></div>" +
      '<div class="credit-row">' +
      '<div class="credit">' +
      esc(credit) +
      "</div>" +
      '<div class="credit-sub">' +
      esc(creditSub) +
      "</div></div>" +
      '<div class="bar-meta">' +
      '<span class="pct' +
      barTone +
      '">' +
      (hasQuota ? Math.round(pctLeft) + "%" : "∞") +
      "</span>" +
      '<span class="side">LEFT</span></div>' +
      '<div class="bar' +
      barTone +
      '" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="' +
      Math.round(pctUsed) +
      '"><i style="width:' +
      pctUsed +
      '%"></i></div>' +
      '<div class="bar-ends"><span>' +
      esc(fmt(used)) +
      " used</span><span>" +
      esc(hasQuota ? fmt(quota) : "∞") +
      " total</span></div>" +
      '<div class="meta">' +
      '<div class="cell"><div class="k">TOTAL QUOTA</div><div class="v"><span>' +
      esc(hasQuota ? full(quota) : "∞") +
      "</span></div></div>" +
      '<div class="cell"><div class="k">CREATED</div><div class="v"><span>' +
      esc(dte(d.createdAt)) +
      "</span></div></div>" +
      '<div class="cell"><div class="k">LAST USED</div><div class="v"><span>' +
      esc(rel(d.lastUsedAt)) +
      "</span></div></div>" +
      '<div class="cell"><div class="k">BASE URL</div><div class="v accent"><span>' +
      esc(bu) +
      '</span><button type="button" class="iconbtn" data-copy="' +
      esc(bu) +
      '" title="Copy base URL" aria-label="Copy base URL">' +
      COPY_SVG +
      "</button></div></div>" +
      "</div></section>" +
      '<section class="card" aria-label="Usable models">' +
      '<div class="mhead"><div class="t">Models</div><div class="c">' +
      models.length +
      " USABLE</div></div>" +
      '<div class="models">' +
      modelsHtml +
      "</div></section></div>"
    );
  }

  function renderBoard(keys) {
    if (!keys || !keys.length) {
      showEmpty("No keys yet", "Nothing has been shared with you right now. Come back later.");
      return;
    }
    empty.classList.add("hidden");
    board.classList.remove("hidden");
    var bu = baseUrl();
    board.innerHTML = keys.map(function (k) { return cardHtml(k, bu); }).join("");
    var anyActive = keys.some(function (k) { return k.status === "active"; });
    setLive(anyActive ? "on" : "bad");
    $("upd").textContent = "updated just now · " + keys.length + " key" + (keys.length === 1 ? "" : "s");
  }

  function load() {
    fetch("/v1/share/board")
      .then(function (r) {
        return r.json().then(function (j) { return { ok: r.ok, j: j }; });
      })
      .then(function (res) {
        if (!res.ok) {
          showEmpty("No keys yet", "Nothing has been shared with you right now. Come back later.");
          return;
        }
        renderBoard(Array.isArray(res.j.keys) ? res.j.keys : []);
      })
      .catch(function () {
        showEmpty("No keys yet", "Nothing has been shared with you right now. Come back later.");
      });
  }

  board.addEventListener("click", function (e) {
    var t = e.target;
    if (!t) return;
    var btn = t.closest ? t.closest("[data-copy]") : null;
    if (btn && btn.getAttribute) copy(btn.getAttribute("data-copy") || "");
  });

  load();
  timer = setInterval(load, 10000);
})();
</script>
</body>
</html>
