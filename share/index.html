<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>etteum · key console</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #0a0c0a;
    --panel: #101410;
    --panel2: #0d110d;
    --line: #1e2a20;
    --line-soft: #16201a;
    --ink: #c9d4cc;
    --dim: #5c6f61;
    --faint: #3a4a3f;
    --grn: #00ff88;
    --grn-dim: #0a3a22;
    --amb: #ffb224;
    --red: #ff5c5c;
    --cyan: #56d4dd;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; background: var(--bg); color: var(--ink); font-family: var(--mono);
    font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;
    padding: 0 0 90px;
  }
  /* scanline / grid ambience */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background:
      repeating-linear-gradient(0deg, transparent 0 2px, rgba(0,255,136,.015) 2px 4px),
      radial-gradient(1000px 480px at 78% -10%, rgba(0,255,136,.06), transparent 60%);
  }
  .wrap { position: relative; z-index: 1; max-width: 880px; margin: 0 auto; padding: 22px 18px 0; }

  /* ── titlebar ─────────────────────────────────────── */
  .tbar {
    display: flex; align-items: center; gap: 12px; padding: 10px 14px;
    border: 1px solid var(--line); border-radius: 10px 10px 0 0; background: var(--panel);
    border-bottom: 0;
  }
  .lights { display: flex; gap: 7px; }
  .lights i { width: 11px; height: 11px; border-radius: 50%; background: var(--faint); }
  .lights i:nth-child(1){ background:#ff5f57; } .lights i:nth-child(2){ background:#febc2e; } .lights i:nth-child(3){ background:#28c840; }
  .ttl { color: var(--dim); font-size: 12px; letter-spacing: .02em; }
  .ttl b { color: var(--ink); font-weight: 600; }
  .sig { margin-left: auto; display: flex; align-items: center; gap: 8px; font-size: 11px; letter-spacing: .12em; color: var(--dim); }
  .sig .blip { width: 8px; height: 8px; border-radius: 50%; background: var(--faint); }
  .sig.on { color: var(--grn); }
  .sig.on .blip { background: var(--grn); box-shadow: 0 0 10px var(--grn); animation: pulse 1.6s infinite; }
  .sig.bad { color: var(--red); } .sig.bad .blip { background: var(--red); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.35} }

  .screen {
    border: 1px solid var(--line); border-radius: 0 0 10px 10px; background:
      linear-gradient(180deg, rgba(0,255,136,.02), transparent 30%), var(--panel2);
    padding: 26px 26px 30px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.8), inset 0 0 0 1px rgba(0,0,0,.4);
  }

  /* ── key entry ────────────────────────────────────── */
  .prompt { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .ps1 { color: var(--grn); font-weight: 800; white-space: nowrap; }
  .keyin {
    flex: 1; min-width: 220px; background: transparent; border: 0; outline: none; color: var(--ink);
    font: inherit; font-size: 15px; caret-color: var(--grn); padding: 10px 2px;
  }
  .keyin::placeholder { color: var(--faint); }
  .go {
    background: var(--grn); color: #031007; border: 0; font: inherit; font-weight: 800; font-size: 13px;
    padding: 10px 18px; border-radius: 6px; cursor: pointer; letter-spacing: .04em;
  }
  .go:hover { box-shadow: 0 0 18px rgba(0,255,136,.4); }
  .go:disabled { opacity: .5; cursor: default; box-shadow: none; }
  .err { color: var(--red); font-size: 13px; min-height: 20px; margin: 8px 2px 0; }
  .err::before { content: "✗ "; }

  /* ── session panel ────────────────────────────────── */
  .hidden { display: none; }
  .sess { margin-top: 22px; animation: rise .35s ease; }
  @keyframes rise { from { opacity: 0; transform: translateY(8px);} to { opacity: 1; transform: none; } }

  .kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .who { display: flex; align-items: center; gap: 10px; min-width: 0; }
  .avatar { width: 34px; height: 34px; border-radius: 7px; background: var(--grn-dim); color: var(--grn);
    display: grid; place-items: center; font-weight: 800; font-size: 15px; }
  .who .nm { font-weight: 800; font-size: 17px; color: var(--ink); }
  .who .tag { color: var(--dim); font-size: 12px; }

  .status { font-size: 11px; font-weight: 800; letter-spacing: .14em; padding: 5px 12px; border-radius: 5px; border: 1px solid; }
  .status.active { color: var(--grn); border-color: var(--grn-dim); background: rgba(0,255,136,.07); }
  .status.exhausted { color: var(--amb); border-color: #4a3a10; background: rgba(255,178,36,.07); }
  .status.expired, .status.inactive { color: var(--red); border-color: #4a1414; background: rgba(255,92,92,.07); }

  /* hero gauge */
  .hero { display: flex; align-items: center; gap: 26px; margin: 26px 0 6px; flex-wrap: wrap; }
  .gauge { position: relative; width: 168px; height: 168px; flex: 0 0 auto; }
  .gauge svg { transform: rotate(-90deg); display: block; }
  .gauge .track { stroke: var(--line); }
  .gauge .fill { stroke: var(--grn); stroke-linecap: round; transition: stroke-dashoffset .7s ease, stroke .3s; filter: drop-shadow(0 0 6px rgba(0,255,136,.5)); }
  .gauge.exhausted .fill { stroke: var(--amb); filter: drop-shadow(0 0 6px rgba(255,178,36,.5)); }
  .gauge .center { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
  .gauge .pct { font-size: 30px; font-weight: 800; color: var(--ink); }
  .gauge .lbl { font-size: 10px; letter-spacing: .2em; color: var(--dim); margin-top: 2px; }

  .bignums { min-width: 0; flex: 1; }
  .credit { font-size: 58px; font-weight: 800; letter-spacing: -2px; line-height: 1; color: var(--grn); text-shadow: 0 0 22px rgba(0,255,136,.35); }
  .credit.dim { color: var(--ink); text-shadow: none; }
  .credit .unit { font-size: 15px; font-weight: 400; color: var(--dim); letter-spacing: 0; margin-left: 10px; }
  .subnums { margin-top: 12px; display: flex; gap: 22px; flex-wrap: wrap; color: var(--dim); font-size: 12px; }
  .subnums b { color: var(--ink); font-weight: 600; }

  /* meta grid */
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1px; background: var(--line-soft);
    border: 1px solid var(--line-soft); border-radius: 8px; overflow: hidden; margin-top: 22px; }
  .cell { background: var(--panel); padding: 13px 15px; min-width: 0; }
  .cell .k { font-size: 10px; letter-spacing: .16em; color: var(--dim); margin-bottom: 5px; }
  .cell .v { font-size: 14px; font-weight: 600; color: var(--ink); display: flex; align-items: center; gap: 7px; min-width: 0; }
  .cell .v span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .cell .v button { background: none; border: 0; color: var(--faint); cursor: pointer; padding: 0; display: inline-flex; }
  .cell .v button:hover { color: var(--grn); }
  .mono { font-family: var(--mono); }
  .accent { color: var(--cyan) !important; }

  /* models */
  .mhead { display: flex; justify-content: space-between; align-items: baseline; margin: 28px 0 12px; }
  .mhead .t { font-size: 12px; letter-spacing: .18em; color: var(--dim); }
  .mhead .c { font-size: 11px; color: var(--faint); letter-spacing: .1em; }
  .models { display: flex; flex-wrap: wrap; gap: 8px; }
  .m {
    font-size: 12.5px; color: var(--ink); background: var(--panel); border: 1px solid var(--line);
    padding: 7px 13px; border-radius: 6px; cursor: pointer; display: inline-flex; align-items: center; gap: 8px;
    transition: border-color .15s, color .15s, transform .05s;
  }
  .m::before { content: "▸"; color: var(--grn); }
  .m:hover { border-color: var(--grn-dim); color: var(--grn); }
  .m:active { transform: scale(.97); }
  .none { color: var(--dim); font-size: 13px; padding: 6px 0; }

  /* footer */
  .foot { margin-top: 30px; display: flex; justify-content: space-between; align-items: center; color: var(--faint); font-size: 11.5px; flex-wrap: wrap; gap: 8px; }
  .foot .dot { display:inline-block; width: 7px; height: 7px; background: var(--grn); border-radius: 1px; margin-right: 7px; animation: pulse 1.6s infinite; }
  .cursor { display: inline-block; width: 8px; height: 15px; background: var(--grn); vertical-align: -2px; animation: blink 1.05s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  .toast {
    position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: var(--panel);
    border: 1px solid var(--grn-dim); color: var(--grn); padding: 9px 16px; border-radius: 6px; font-size: 12.5px;
    opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 9;
  }
  .toast.show { opacity: 1; }

  @media (max-width: 640px) {
    .grid { grid-template-columns: repeat(2, 1fr); }
    .credit { font-size: 44px; }
    .gauge { width: 140px; height: 140px; }
    .screen { padding: 20px 16px 24px; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="tbar">
    <div class="lights"><i></i><i></i><i></i></div>
    <div class="ttl"><b>etteum</b> — key console</div>
    <div class="sig" id="sig"><span class="blip"></span><span id="sigtxt">STANDBY</span></div>
  </div>

  <div class="screen">
    <div class="prompt">
      <span class="ps1">etteum@pool:~$</span>
      <input id="key" class="keyin" type="password" placeholder="auth --key sk-pool-…" autocomplete="off" spellcheck="false" />
      <button class="go" id="view">connect ⏎</button>
    </div>
    <div class="err" id="err"></div>

    <div id="sess" class="sess hidden">
      <div class="kv">
        <div class="who">
          <div class="avatar" id="avatar">k</div>
          <div>
            <div class="nm" id="kname">—</div>
            <div class="tag mono" id="kprev">sk-…</div>
          </div>
        </div>
        <span class="status active" id="kstatus">ACTIVE</span>
      </div>

      <div class="hero">
        <div class="gauge" id="gauge">
          <svg width="100%" height="100%" viewBox="0 0 120 120">
            <circle class="track" cx="60" cy="60" r="52" fill="none" stroke-width="9"/>
            <circle class="fill" id="arc" cx="60" cy="60" r="52" fill="none" stroke-width="9"
              stroke-dasharray="326.7" stroke-dashoffset="326.7"/>
          </svg>
          <div class="center">
            <div>
              <div class="pct" id="pct">0%</div>
              <div class="lbl">CREDIT</div>
            </div>
          </div>
        </div>
        <div class="bignums">
          <div class="credit" id="credit">0<span class="unit" id="unit">tokens left</span></div>
          <div class="subnums">
            <span>used <b id="used">0</b></span>
            <span>quota <b id="quota">∞</b></span>
            <span id="ratew">rate <b id="rate">∞</b></span>
          </div>
        </div>
      </div>

      <div class="grid">
        <div class="cell"><div class="k">BASE ROUTE</div><div class="v accent"><span id="base">/v1</span><button id="copybase" title="copy base url"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg></button></div></div>
        <div class="cell"><div class="k">CREATED</div><div class="v"><span id="created">—</span></div></div>
        <div class="cell"><div class="k">LAST USED</div><div class="v"><span id="last">—</span></div></div>
        <div class="cell"><div class="k">EXPIRES</div><div class="v"><span id="expires">never</span></div></div>
      </div>

      <div class="mhead">
        <div class="t">MODELS</div>
        <div class="c" id="mcount">0 USABLE</div>
      </div>
      <div class="models" id="models"></div>
    </div>
  </div>

  <div class="foot">
    <div><span class="dot"></span><span id="upd">awaiting key</span></div>
    <div>session <span class="cursor"></span></div>
  </div>
</div>
<div class="toast" id="toast">copied</div>

<script>
(function () {
  "use strict";
  var $ = function (id) { return document.getElementById(id); };
  var keyInput = $("key"), err = $("err"), sess = $("sess"), toast = $("toast");
  var currentKey = null, timer = null, toastT = null;
  var CIRC = 326.7;

  var BACKEND = "__BACKEND_ORIGIN__";
  // Optional absolute base URL for the pool's /v1 route (used when the backend
  // is reached through a tunnel / different host than this page). Falls back to
  // the path-only "/v1".
  var BASE_URL = "__SHARE_BASE_URL__";

  function fmt(n) {
    if (n == null) return "∞";
    n = Math.round(n);
    if (n >= 1e9) return trim(n / 1e9) + "B";
    if (n >= 1e6) return trim(n / 1e6) + "M";
    if (n >= 1e3) return trim(n / 1e3) + "K";
    return String(n);
  }
  function trim(x) { return x.toFixed(x >= 100 ? 0 : x >= 10 ? 1 : 2).replace(/\.0+$|(\.\d*?)0+$/, "$1"); }
  function full(n) { return n == null ? "∞" : Math.round(n).toLocaleString("en-US"); }
  function rel(iso) {
    if (!iso) return "never";
    var t = new Date(iso).getTime(); if (isNaN(t)) return "—";
    var s = Math.max(0, (Date.now() - t) / 1000);
    if (s < 45) return "just now";
    if (s < 3600) return Math.floor(s / 60) + "m ago";
    if (s < 86400) return Math.floor(s / 3600) + "h ago";
    return Math.floor(s / 86400) + "d ago";
  }
  function dte(iso) {
    if (!iso) return "—";
    var d = new Date(iso); if (isNaN(d)) return "—";
    return d.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
  }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]; }); }

  function setSig(state) {
    var el = $("sig"), txt = $("sigtxt");
    el.className = "sig" + (state === "on" ? " on" : state === "bad" ? " bad" : "");
    txt.textContent = state === "on" ? "LINKED" : state === "bad" ? "DENIED" : "STANDBY";
  }

  function baseUrl() {
    if (BASE_URL && BASE_URL !== "__SHARE_BASE_URL__") return BASE_URL;
    return BACKEND + "/v1";
  }

  function render(d) {
    sess.classList.remove("hidden");
    var nm = d.name || "friend key";
    $("kname").textContent = nm;
    $("avatar").textContent = (nm.trim()[0] || "k").toLowerCase();
    $("kprev").textContent = d.keyPreview || "sk-…";

    var st = d.status || "active";
    var stEl = $("kstatus");
    stEl.textContent = st.toUpperCase();
    stEl.className = "status " + st;
    setSig(st === "active" ? "on" : "bad");

    var quota = d.tokenQuota, used = d.tokensUsed || 0, left = d.tokensLeft;
    var hasQuota = quota != null && quota > 0;
    var pct = hasQuota ? Math.max(0, Math.min(100, (left != null ? left : 0) / quota * 100)) : 100;

    var creditEl = $("credit");
    if (hasQuota) {
      creditEl.firstChild.nodeValue = fmt(left);
      $("unit").textContent = "tokens left · " + full(left);
    } else {
      creditEl.firstChild.nodeValue = "∞";
      $("unit").textContent = "unlimited tokens";
    }
    creditEl.classList.toggle("dim", !hasQuota);

    var gauge = $("gauge");
    gauge.classList.toggle("exhausted", hasQuota && pct <= 0);
    $("arc").style.strokeDashoffset = String(CIRC * (1 - pct / 100));
    $("pct").textContent = hasQuota ? Math.round(pct) + "%" : "∞";

    $("used").textContent = fmt(used);
    $("quota").textContent = hasQuota ? fmt(quota) : "∞";
    $("rate").textContent = d.rateLimit ? d.rateLimit + "/min" : "∞";

    $("base").textContent = baseUrl();
    $("created").textContent = dte(d.createdAt);
    $("last").textContent = rel(d.lastUsedAt);
    $("expires").textContent = d.expiresAt ? dte(d.expiresAt) : "never";

    var models = Array.isArray(d.models) ? d.models : [];
    $("mcount").textContent = models.length + " USABLE";
    var box = $("models"); box.innerHTML = "";
    if (!models.length) box.innerHTML = '<div class="none">// no models available for this key</div>';
    models.forEach(function (id) {
      var el = document.createElement("button");
      el.className = "m";
      el.textContent = id;
      el.title = "copy model id";
      el.onclick = function () { copy(id); };
      box.appendChild(el);
    });
    $("upd").textContent = "synced " + new Date().toLocaleTimeString();
  }

  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(text).then(showToast, function () {});
    }
  }
  function showToast() {
    toast.classList.add("show");
    if (toastT) clearTimeout(toastT);
    toastT = setTimeout(function () { toast.classList.remove("show"); }, 1400);
  }

  function fail(msg) {
    sess.classList.add("hidden");
    setSig("bad");
    err.textContent = msg || "";
  }

  function load() {
    if (!currentKey) return;
    fetch(BACKEND + "/v1/share", { headers: { "Authorization": "Bearer " + currentKey } })
      .then(function (r) { return r.json().then(function (j) { return { ok: r.ok, j: j }; }); })
      .then(function (res) {
        if (!res.ok) { fail((res.j && res.j.error && res.j.error.message) || "invalid key"); return; }
        err.textContent = "";
        render(res.j);
      })
      .catch(function () { fail("could not reach the pool backend"); });
  }

  function start() {
    var k = keyInput.value.trim();
    if (!k) { fail("paste a key first"); return; }
    currentKey = k;
    err.textContent = "";
    if (timer) clearInterval(timer);
    load();
    timer = setInterval(load, 10000);
  }

  $("view").addEventListener("click", start);
  keyInput.addEventListener("keydown", function (e) { if (e.key === "Enter") start(); });
  $("copybase").addEventListener("click", function () { copy(baseUrl()); });
})();
</script>
</body>
</html>
