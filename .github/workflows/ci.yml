name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Install dashboard dependencies
        # The dashboard is a standalone sub-project (own package.json + bun.lock
        # under dashboard/) — it isn't covered by the root workspace install.
        # Without this, the `Build dashboard` step fails with
        # "JSX.IntrinsicElements does not exist" because @types/react is absent.
        run: cd dashboard && bun install --frozen-lockfile
      - name: Typecheck
        run: bunx tsc --noEmit -p tsconfig.ci.json
      - name: Push DB schema
        # Create the SQLite schema from src/db/schema.ts so the DB-backed tests
        # (pricing, BYOK, sticky round-robin, search) have tables to query.
        # drizzle/ may also be present; runMigrations() tolerates "already exists"
        # when a later test re-applies the journal on a push-created DB.
        # mkdir first: better-sqlite3 won't create the data/ dir itself. The
        # final test guards against drizzle-kit silently exiting 0 on error.
        run: |
          mkdir -p data
          bunx drizzle-kit push --force
          test -f data/poolprox3.db
      - name: Run tests
        # Self-contained suite (own env vars + DI-mocked providers). Hard gate.
        # --isolate gives each test file a fresh global so per-file DATABASE_PATH
        # redirects and module state can't leak across files sharing a process.
        # ENCRYPTION_KEY: crypto.ts refuses to encrypt without >= 16 chars and
        # many suites (pool, byok, keys, backup) seed accounts via encrypt().
        env:
          ENCRYPTION_KEY: ci-test-encryption-key-32chars
          API_KEY: ci-test-api-key
          POOLPROX_ALLOW_INSECURE: "1"
        run: bun test --isolate
      - name: Build dashboard
        run: bun run build
